{% extends "base.html" %}

{% block title %}Gallery | Stone Craft Cafe & Bistro{% endblock %}

{% block content %}
<section class="gallery-empty-page">
    <div class="section-shell">
        <div class="gallery-empty-content reveal">
            <span class="eyebrow" data-th="แกลเลอรี" data-en="GALLERY">แกลเลอรี</span>

            <img class="gallery-empty-logo"
                 src="{{ url_for('static', filename='img/stonecraft-logo.webp') }}"
                 alt="Stone Craft Cafe & Bistro">

            <h1 data-th="เรื่องราวบทใหม่กำลังจะเริ่มต้น"
                data-en="A new visual story is coming soon.">
                เรื่องราวบทใหม่กำลังจะเริ่มต้น
            </h1>

            <p data-th="รูปภาพบรรยากาศ อาหาร และกิจกรรมของ Stone Craft จะถูกนำมาเผยแพร่เร็ว ๆ นี้"
               data-en="Photos of our atmosphere, cuisine, and special events will be published soon.">
                รูปภาพบรรยากาศ อาหาร และกิจกรรมของ Stone Craft จะถูกนำมาเผยแพร่เร็ว ๆ นี้
            </p>

            <div class="gallery-empty-actions">
                <a href="{{ url_for('home') }}" class="button button-outline"
                   data-th="กลับหน้าแรก" data-en="Back to Home">กลับหน้าแรก</a>
                <a href="{{ url_for('reservation') }}" class="button button-gold"
                   data-th="สำรองโต๊ะ" data-en="Reserve a Table">สำรองโต๊ะ</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
